[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./deployments" }]

[rpc_endpoints]
coston2 = "${COSTON2_RPC}"

[etherscan]
coston2 = { key = "${COSTON2_EXPLORER_API_KEY}", url = "https://coston2-explorer.flare.network/api" }
